<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080a" />
    <meta name="description" content="The Twentieth Bell — a dark fantasy Three.js survival ritual." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>The Twentieth Bell</title>
  </head>
  <body>
    <main id="app">
      <div id="stage" role="application" aria-label="The Twentieth Bell battlefield and ritual interface"></div>
      <section id="accessibility" class="visually-hidden" aria-label="Accessible ritual controls">
        <h1>The Twentieth Bell</h1>
        <p id="accessible-status">The ritual awaits the first bell.</p>
        <div id="accessible-controls"></div>
        <div id="encounter-announcer" aria-live="assertive" aria-atomic="true"></div>
        <div id="feed-announcer" aria-live="polite" aria-atomic="true"></div>
      </section>
    </main>
    <noscript>This ritual requires JavaScript and WebGL. Even the dead manage both.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
